<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credit Risk Analysis</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
    <div class="container">
        <h1 class="mt-5">Credit Risk Analysis Tool</h1>

        <!-- Form for ticker and date range -->
        <form method="POST" action="/">
            <div class="form-group">
                <label for="ticker">Ticker Symbol:</label>
                <input type="text" class="form-control" id="ticker" name="ticker" required>
            </div>
            <div class="form-group">
                <label for="start_date">Start Date (YYYY-MM-DD):</label>
                <input type="date" class="form-control" id="start_date" name="start_date" required>
            </div>
            <div class="form-group">
                <label for="end_date">End Date (YYYY-MM-DD):</label>
                <input type="date" class="form-control" id="end_date" name="end_date" required>
            </div>
            <button type="submit" class="btn btn-primary">Analyze</button>
        </form>

        <!-- Error message if input is invalid -->
        {% if error %}
            <div class="alert alert-danger mt-4" role="alert">
                {{ error }}
            </div>
        {% endif %}

        {% if plot_url %}
            <h3 class="mt-5">Cumulative Returns Plot</h3>
            <img src="{{ plot_url }}" alt="Cumulative Returns Plot" class="img-fluid">
        {% endif %}

        {% if table_html %}
            <h3 class="mt-5">Analysis Table for {{ ticker }}</h3>
            <div>{{ table_html | safe }}</div>
        {% endif %}
    </div>
</body>
</html>
